<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <!-- The browser bar takes the app's own background (--bg in app.css), so
         the bar and the page read as one surface. -->
    <meta name="theme-color" content="#ffffff" />
    <!-- SVG for tabs (sharp at 16-32 px); a 180 px PNG for the iOS/Android home
         screen, which do not take SVG. Relative paths: the app lives under a
         subpath on Pages. -->
    <link rel="icon" href="assets/icon/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="assets/icon/apple-touch-icon.png" />
    <!-- The product name, not a translated string: it is the same in both
         languages, and it is what a bookmark and a home-screen icon carry.
         The heading inside the app stays descriptive. -->
    <title>Agonist</title>
    <!-- Start the requests now instead of when the module has been parsed and
         reaches its own fetch() calls. Paths and the crossorigin flag must
         match those calls, or the browser fetches everything twice. The
         module's own imports are listed too, so they do not queue behind it. -->
    <link rel="modulepreload" href="app/ui.mjs" />
    <link rel="modulepreload" href="app/atlas.mjs" />
    <link rel="modulepreload" href="app/i18n.mjs" />
    <link rel="modulepreload" href="app/icons.mjs" />
    <link rel="modulepreload" href="app/route.mjs" />
    <link rel="modulepreload" href="app/screens.mjs" />
    <link rel="modulepreload" href="app/spy.mjs" />
    <link rel="modulepreload" href="app/zoom.mjs" />
    <link rel="preload" as="fetch" crossorigin href="content/muscles.json" />
    <link rel="preload" as="fetch" crossorigin href="content/muscle-groups.json" />
    <link rel="preload" as="fetch" crossorigin href="content/exercises.json" />
    <link rel="preload" as="fetch" crossorigin href="assets/atlas/muscle-ids.json" />
    <link rel="preload" as="fetch" crossorigin href="assets/atlas/front.svg" />
    <link rel="preload" as="fetch" crossorigin href="assets/atlas/back.svg" />
    <!-- The fonts are a nicety: they load without blocking the first paint
         (print until loaded, then all) and swap in; until then, and if they
         never arrive, the system fonts in app.css carry the page. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap"
      media="print"
      onload="this.media = 'all'"
    />
    <link rel="stylesheet" href="app/app.css" />
    <!-- ui.mjs writes the colour rules here: a Muscle's or an Exercise's Muscles
         by Role. One selector per Muscle instead of a walk over paths. -->
    <style id="paint"></style>
    <!-- …and here, after it, what the row being read lights: same weight, so
         it wins over the page's own colours. -->
    <style id="lit"></style>
  </head>
  <body>
    <div id="app">
      <header id="bar">
        <button id="brand" type="button" data-act="home">Agonist</button>
        <span class="bar-end">
          <button id="play" type="button" data-act="play"></button>
          <button id="lang" type="button" data-act="lang"></button>
        </span>
      </header>

      <main id="page" data-screen="home">
        <!-- Until the data arrives the page says so, in the default language;
             the app replaces it on the first draw. -->
        <div id="top"><p class="loading">Завантаження…</p></div>
        <!-- «Show the map» — all that is left of it while it is hidden. -->
        <button id="mapbar" type="button" data-act="show-map" hidden></button>
        <!-- Both sides of the body, pinned under the top of the page while the
             list below scrolls. The dock keeps the pinned place and size when
             the map itself is taken out to fill the whole screen. -->
        <div id="dock">
          <figure id="map" data-side="front">
            <div class="layer">
              <div class="fig" data-view="front"></div>
              <div class="fig" data-view="back"></div>
            </div>
            <!-- Shown while a row is lit: back to the whole picture. -->
            <button class="all" type="button" data-act="all" hidden></button>
            <!-- On the page (.pg): hide, expand. Expanded (.fl): the side, and the way out. -->
            <div class="tools">
              <button class="ic pg" type="button" data-act="hide-map"></button>
              <button class="ic pg" type="button" data-act="full-map"></button>
              <div class="seg fl" role="group">
                <button type="button" data-act="side" data-side="front"></button>
                <button type="button" data-act="side" data-side="back"></button>
              </div>
              <button class="ic fl" type="button" data-act="close-map"></button>
            </div>
            <!-- «Whole body» shows only once the map is zoomed. -->
            <div class="zoom">
              <button class="ic" type="button" data-act="fit" hidden></button>
              <button class="ic" type="button" data-act="zoom-out"></button>
              <button class="ic" type="button" data-act="zoom-in"></button>
            </div>
            <!-- Expanded, a tap only picks; this is the pick and the way into it. -->
            <div class="pick" aria-live="polite" hidden>
              <b></b>
              <button type="button" data-act="open-pick"></button>
            </div>
          </figure>
        </div>
        <div id="list"></div>
      </main>

      <div id="bottom"></div>
    </div>

    <script type="module">
      import { start } from './app/ui.mjs';

      // A typo in a Muscle id must break loudly. Without this the promise
      // rejects into the console and the Trainer just gets a blank figure.
      const fail = (error) => {
        // The raw message is for the developer; the sentence above it is for
        // the Trainer. This runs when the module itself may not have loaded,
        // so it cannot use the dictionary: the default language only.
        const next = document.createElement('p');
        next.textContent = 'Не вдалося завантажити. Перезавантажте сторінку; якщо не допомогло — перевірте зв\'язок або напишіть розробнику.';
        const raw = document.createElement('p');
        raw.textContent = error?.message ?? String(error);
        const top = document.getElementById('top');
        top.className = 'failure';
        top.replaceChildren(next, raw);
      };
      start().catch(fail);
      // A failure after start — in a later screen — must not leave it half-drawn in silence.
      addEventListener('error', (event) => fail(event.error ?? event.message));
      addEventListener('unhandledrejection', (event) => fail(event.reason));
    </script>
  </body>
</html>
