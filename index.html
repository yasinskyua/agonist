<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <!-- The product name, not a translated string: it is the same in both
         languages, and it is what a bookmark and a home-screen icon carry.
         The heading inside the app stays descriptive. -->
    <title>Agonist</title>
    <link rel="stylesheet" href="app/app.css" />
    <!-- ui.mjs writes the highlight rule here: one selector instead of a
         walk over paths. -->
    <style id="highlight"></style>
  </head>
  <body>
    <header>
      <h1 id="title"></h1>
      <button id="credits-link" type="button" class="quiet"></button>
      <button id="lang" type="button"></button>
    </header>

    <main id="map"></main>

    <p id="hint"></p>

    <section id="panel" aria-live="polite" hidden></section>

    <section id="credits" hidden></section>

    <nav id="views">
      <button id="view-front" type="button"></button>
      <button id="view-back" type="button"></button>
    </nav>

    <script type="module">
      import { start } from './app/ui.mjs';

      // A typo in a Muscle id must break loudly. Without this the promise
      // rejects into the console and the Trainer just gets a blank figure.
      start().catch((error) => {
        const panel = document.getElementById('panel');
        panel.hidden = false;
        panel.className = 'failure';
        panel.textContent = error.message;
      });
    </script>
  </body>
</html>
